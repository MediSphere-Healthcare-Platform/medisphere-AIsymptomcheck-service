spring.application.name=medisphere-AIsymptomcheck-service
server.port=8088

# 1. Data Source configuration (Neon PostgreSQL)
spring.datasource.url=jdbc:postgresql://ep-spring-haze-a1my82ya-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_q4AfizWR1LlF
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. HikariCP Connection Pool Settings (Stability Fixes)
# Neon closes idle connections every 30 mins; we retire them at 10 mins to be safe.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# 3. JPA / Hibernate properties
# Removed hibernate.dialect (auto-detected in Hibernate 7+)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 4. GROQ API Configuration
groq.api-url=https://api.groq.com/openai/v1/chat/completions
groq.api-key=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

# 5. Security & JWT (Secret must be Base64 encoded)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# 6. Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Set to true if running with the Gateway/Naming Server
eureka.client.enabled=false

# 7. Inter-service URLs
services.patient-url=http://localhost:8084

# 8. Actuator for monitoring
management.endpoints.web.exposure.include=health,info,metrics

# 9. Logging levels
logging.level.com.medisphere=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE